[package]
name = "arxml-model-r4-0"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Generated AUTOSAR R4.0 model (AUTOSAR_00047.xsd) with read / write / validate helpers"

[features]
default = ["generated"]
